name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --dev
      - name: Lint (ruff)
        run: uv run ruff check .

  test:
    # Windows earns its slot here rather than only at release: the path handling
    # (os.sep guards, flow-id joins) and the npx/uvx argv building are where this
    # codebase actually breaks per-OS, and finding that at release time means it
    # blocks the release. macOS is close enough to Linux to leave to release.yml.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --dev
      - name: Tests (live harness excluded via marker)
        run: uv run pytest

  fresh-install:
    # The jobs above run on uv.lock. `pip install flow-atelier` and
    # `uv tool install flow-atelier` ignore the lock and take the newest versions
    # pyproject.toml allows, so this job installs the wheel that way and tests it.
    # A dependency release that breaks the package fails here first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv build --wheel
      - name: Install the wheel without the lock
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/fresh"
          uv pip install --python "$RUNNER_TEMP/fresh" dist/*.whl --group dev
      - name: Tests against the installed wheel
        # With the source package gone, every import, including the ones in
        # the CLIs and agents the tests start, comes from the installed wheel.
        run: |
          rm -rf flow_atelier
          "$RUNNER_TEMP/fresh/bin/python" -m pytest

  desktop:
    name: Desktop (macOS arm64)
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.13 && uv sync --locked
      - run: cargo install tauri-cli --version '=2.12.1' --locked
      - run: cargo test --release --locked --manifest-path desktop/Cargo.toml
      - run: cargo clippy --release --locked --manifest-path desktop/Cargo.toml --all-targets -- -D warnings
      - name: Test native notices and signing modes
        run: |
          clang -Wall -Werror -fobjc-arc desktop/tests/notifications.m -framework Foundation -framework UserNotifications -o "$RUNNER_TEMP/notices"
          "$RUNNER_TEMP/notices"
          bash desktop/tests/signing-mode.sh
      - name: Build and exercise the unsigned app bundle
        run: |
          desktop/build.sh
          export ATELIER_TEST_DESKTOP_SIDECAR="$PWD/desktop/target/release/bundle/macos/Flow Atelier.app/Contents/Resources/atelier/atelier"
          uv run --locked pytest -q tests/cli/test_serve_idle_exit.py::test_desktop_parent_death_stops_server_and_active_shell
