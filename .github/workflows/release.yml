name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pyver=$(grep -E '^version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          test "$tag" = "$pyver" || { echo "tag $tag != pyproject $pyver"; exit 1; }

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run pytest

  build-wheel:
    needs: [verify-version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  build-binary:
    needs: [verify-version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: atelier-linux-x86_64
            bin: atelier
          - os: macos-latest
            asset: atelier-macos-arm64
            bin: atelier
          - os: windows-latest
            asset: atelier-windows-x86_64.exe
            bin: atelier.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --dev
      - name: Build binary
        shell: bash
        run: |
          uv run pyinstaller scripts/atelier_entry.py \
            --onefile --name atelier --clean --noconfirm \
            --copy-metadata flow-atelier \
            --collect-data flow_atelier \
            --collect-all uvicorn \
            --collect-all apscheduler \
            --collect-all tzdata \
            --collect-all agent_client_protocol
      - name: Smoke test the binary
        shell: bash
        run: |
          ./dist/${{ matrix.bin }} --help
          ./dist/${{ matrix.bin }} --version
      - name: Rename for upload
        shell: bash
        run: mv dist/${{ matrix.bin }} dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}
          path: dist/${{ matrix.asset }}

  build-desktop:
    needs: [verify-version, test]
    runs-on: macos-15
    environment: macos-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.13 && uv sync --locked
      - run: cargo install tauri-cli --version '=2.12.1' --locked
      - name: Test desktop lifecycle helpers
        run: |
          cargo test --release --locked --manifest-path desktop/Cargo.toml
          clang -Wall -Werror -fobjc-arc desktop/tests/notifications.m -framework Foundation -framework UserNotifications -o "$RUNNER_TEMP/notices"
          "$RUNNER_TEMP/notices"
          bash desktop/tests/signing-mode.sh
      - name: Build macOS arm64 disk image
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: desktop/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: desktop/build/Flow-Atelier-macos-arm64-*.dmg
          if-no-files-found: error

  publish-pypi:
    needs: [build-wheel, build-binary]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build-wheel, build-binary, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: mkdir -p release && find artifacts -type f -exec cp {} release/ \;
      - name: Generate SHA256SUMS
        working-directory: release
        run: sha256sum -- * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
