name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pyver=$(grep -E '^version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          test "$tag" = "$pyver" || { echo "tag $tag != pyproject $pyver"; exit 1; }

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run pytest

  build-wheel:
    needs: [verify-version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv build
      - name: Verify bundled frontend notices
        run: |
          uv run --no-project python - dist/*.whl <<'PY'
          from pathlib import Path
          from sys import argv
          from zipfile import ZipFile

          notices = [
              Path("THIRD_PARTY_NOTICES.md"),
              Path("licenses/frontend/JS-LICENSES.txt"),
              Path("licenses/frontend/Geist-Sans-OFL.txt"),
              Path("licenses/frontend/JetBrains-Mono-OFL.txt"),
              Path("licenses/frontend/Young-Serif-OFL.txt"),
          ]
          with ZipFile(argv[1]) as wheel:
              metadata = next(name for name in wheel.namelist() if name.endswith(".dist-info/METADATA"))
              license_dir = metadata.removesuffix("METADATA") + "licenses/"
              for notice in notices:
                  member = license_dir + notice.as_posix()
                  if wheel.read(member) != notice.read_bytes():
                      raise SystemExit(f"Incorrect license notice: {member}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  build-binary:
    needs: [verify-version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: atelier-linux-x86_64
            bin: atelier
          - os: macos-latest
            asset: atelier-macos-arm64
            bin: atelier
          - os: windows-latest
            asset: atelier-windows-x86_64.exe
            bin: atelier.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --no-dev --group build
      - name: Build binary
        shell: bash
        run: |
          uv run --no-sync pyinstaller scripts/atelier_entry.py \
            --onefile --name atelier --clean --noconfirm \
            --copy-metadata flow-atelier \
            --collect-data flow_atelier \
            --add-data "flow_atelier/product_events.py:flow_atelier" \
            --collect-all uvicorn \
            --collect-all apscheduler \
            --collect-all tzdata \
            --collect-all agent_client_protocol
      - name: Smoke test the binary
        shell: bash
        run: |
          ./dist/${{ matrix.bin }} --help
          ./dist/${{ matrix.bin }} --version
          export ATELIER_GLOBAL_ATELIER_DIR="$RUNNER_TEMP/platform-smoke"
          export ATELIER_NO_UPDATE_CHECK=1
          ./dist/${{ matrix.bin }} install builtin:platform --no-project
          for recipe in meetings-to-tasks error-to-pr idea-to-product continuous-improvement; do
            test -s "$ATELIER_GLOBAL_ATELIER_DIR/conduits/$recipe/conduit.yaml"
          done
      - name: Rename for upload
        shell: bash
        run: mv dist/${{ matrix.bin }} dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}
          path: dist/${{ matrix.asset }}

  publish-pypi:
    needs: [build-wheel, build-binary]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build-wheel, build-binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: release
      - name: Generate SHA256SUMS
        working-directory: release
        run: sha256sum -- * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
