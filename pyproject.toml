[project]
name = "flow-atelier"
version = "0.15.0"
description = "CLI tool and async workflow engine for running reproducible DAG workflows (conduits)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "licenses/frontend/*.txt"]
requires-python = ">=3.13"
dependencies = [
    "typer>=0.19.0",
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "rich>=13.7",
    "agent-client-protocol>=0.10.1,<0.11",
    "apscheduler>=3.10,<4",
    "tzdata>=2024.1",
    "tzlocal>=5.2",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "prompt-toolkit>=3.0",
    "mcp>=1.30,<2",
    "keyring>=25,<26",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
push = ["pywebpush>=2.5.0"]

[project.scripts]
atelier = "flow_atelier.main:app"

[project.urls]
Homepage = "https://flow-atelier.andesprit.com/"
Documentation = "https://flow-atelier.andesprit.com/docs/"
Repository = "https://github.com/Andesprit/flow-atelier"
Issues = "https://github.com/Andesprit/flow-atelier/issues"
Changelog = "https://github.com/Andesprit/flow-atelier/blob/main/CHANGELOG.md"

[dependency-groups]
build = ["pyinstaller>=6.10"]
docs = ["zensical==0.1.3"]
dev = [
    { include-group = "build" },
    "pywebpush>=2.5.0",
    "httpx>=0.28.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "websockets>=16.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "jsonschema>=4.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 300
addopts = "-m 'not live'"
markers = [
    "live: exercises real AI harness CLIs (slow, costs tokens); run with -m live",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "B008",
    "B904",
    "E402",
    "E741",
    "SIM105",
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM", "E501"]

[tool.hatch.build.targets.wheel]
packages = ["flow_atelier"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
