[project]
site_name = "Flow Atelier"
site_description = "Run repeatable workflows with shell commands, coding agents, and human approvals."
site_url = "https://flow-atelier.andesprit.com/docs/"
repo_url = "https://github.com/Andesprit/flow-atelier"
repo_name = "Andesprit/flow-atelier"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
dev_addr = "127.0.0.1:8101"
strict = true

# GitHub renders this contents page. The site serves redirects at its old URL.
exclude_docs = "guide.md"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Install" = "getting-started/install.md" },
    { "Quickstart" = "getting-started/quickstart.md" },
    { "How a conduit runs" = "getting-started/how-a-conduit-runs.md" },
    { "Your first workflow" = "first-workflow.md" },
  ] },
  { "Guides" = [
    { "Authoring conduits" = "guides/authoring.md" },
    { "Validating conduits" = "guides/validation.md" },
    { "Interaction policies" = "interaction.md" },
    { "Multi-agent workflows" = [
      { "A fix loop with agent reviews" = "loop-agents-graph.md" },
      { "Check the team before a run" = "checking-the-team-before-a-run.md" },
      { "Reuse a workflow with other agents" = "reusing-a-workflow-with-other-agents.md" },
      { "Parallel agents in separate checkouts" = "parallel-agents-in-separate-checkouts.md" },
      { "When to add a second agent" = "multi-agent-workflow.md" },
    ] },
    { "Recover a failed workflow" = "recovering-a-failed-workflow.md" },
    { "Run on a schedule" = "guides/schedules.md" },
    { "Run unattended on Cloud Run" = "running-unattended.md" },
    { "Packages and platform recipes" = "guides/packages.md" },
    { "Dashboard and run pages" = "guides/dashboard.md" },
    { "Integrations and deployment" = [
      { "Dictaria meetings" = "meetings-to-tasks.md" },
      { "Continuous improvement" = "continuous-improvement.md" },
      { "Error webhooks" = "error-webhooks.md" },
      { "WhatsApp run summaries" = "guides/whatsapp.md" },
      { "Product deployment on Cloud Run" = "product-deployment.md" },
    ] },
  ] },
  { "Reference" = [
    { "CLI" = "reference/cli.md" },
    { "Command overview" = "reference/command-overview.md" },
    { "HTTP API" = "reference/http-api.md" },
    { "Server and WebSocket behavior" = "reference/serving.md" },
    { "Runner wire contract" = "runner/README.md" },
    { "Conduit YAML" = "reference/conduit-yaml.md" },
  ] },
  { "Configuration" = [
    { "Where conduits live and folder layout" = "configuration/locations.md" },
    { "Settings and environment variables" = "configuration/settings.md" },
    { "Agent logins and credentials" = "configuration/agent-logins.md" },
    { "Security" = "configuration/security.md" },
  ] },
  { "Upgrading" = [
    { "Upgrade notes" = "upgrading.md" },
    { "Roadmap" = "roadmap.md" },
  ] },
  { "Contributing" = [
    { "How to contribute" = "contributing/index.md" },
    { "Development" = "contributing/development.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.path",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.plugins.search]

[project.plugins.redirects.redirect_maps]
